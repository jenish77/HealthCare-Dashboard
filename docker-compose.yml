version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: health_care_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: health_care_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/health_care_db
      - ACCESS_TOKEN_SECRET=healthtech_access_secret_key_2026_super_secure_987654321
      - REFRESH_TOKEN_SECRET=healthtech_refresh_secret_key_2026_super_secure_123456789
      - ACCESS_TOKEN_EXPIRE=15m
      - REFRESH_TOKEN_EXPIRE=7d
      - CLIENT_URL=http://localhost:3000
      - NODE_ENV=production
    depends_on:
      - mongodb
    restart: always

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: health_care_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    restart: always

volumes:
  mongo_data:
